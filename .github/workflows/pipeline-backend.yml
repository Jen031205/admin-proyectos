name: Pipeline MicroservicioBack (Ejercicio5MyAPIGestor)

on:
  push:
    branches: [ "main" ]
    paths:
      - "Ejercicio5MyAPIGestor/**"
      - ".github/workflows/pipeline-backend.yml"
  workflow_dispatch:

jobs:
  build-test-backend:
    name: "MicroservicioBack: Build, Tests JaCoCo y Semgrep SAST"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21 LTS y Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 3. Compilación, Pruebas Unitarias (Surefire) y Reporte JaCoCo (>80%)
        working-directory: Ejercicio5MyAPIGestor
        run: mvn clean test jacoco:report

      - name: 4. Escaneo de Seguridad SAST - Semgrep (Excluyendo target)
        run: |
          mkdir -p reportes
          pip install semgrep
          semgrep scan --config=p/default Ejercicio5MyAPIGestor --exclude="target" --json --output=reportes/semgrep-back.json || true
          md5sum reportes/semgrep-back.json > reportes/semgrep-back.json.md5

      - name: 5. Archivar Reporte JaCoCo y Semgrep Firmado (Backend)
        uses: actions/upload-artifact@v4
        with:
          name: reportes-microservicio-back
          path: |
            Ejercicio5MyAPIGestor/target/site/jacoco/
            reportes/semgrep-back.json
            reportes/semgrep-back.json.md5
