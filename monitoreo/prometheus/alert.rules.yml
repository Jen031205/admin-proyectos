groups:
  - name: alertas-circuito-devops
    rules:
      - alert: MicroservicioNoDisponible
        expr: probe_success{job="microservicios-http-probes"} == 0
        for: 30s
        labels:
          severity: critical
          service: admin-proyectos
        annotations:
          summary: "Endpoint caído o inalcanzable: {{ $labels.instance }}"
          description: "El servicio {{ $labels.instance }} no responde HTTP 200 desde hace más de 30 segundos."

      - alert: BaseDeDatosMariaDBCaida
        expr: probe_success{job="mariadb-tcp-probe"} == 0
        for: 20s
        labels:
          severity: critical
          service: mariadb-dbgestor
        annotations:
          summary: "Base de datos MariaDB (dbgestor) sin conexión TCP"
          description: "El contenedor mariadb-dbgestor:3306 no acepta conexiones TCP."

      - alert: AltaLatenciaRespuestaHTTP
        expr: probe_duration_seconds{job="microservicios-http-probes"} > 0.5
        for: 1m
        labels:
          severity: warning
          service: admin-proyectos
        annotations:
          summary: "Latencia HTTP mayor a 500ms en {{ $labels.instance }}"
          description: "El tiempo de respuesta de {{ $labels.instance }} superó los 500ms ({{ $value }}s)."

      - alert: ErrorCodigoHTTP5xx
        expr: probe_http_status_code{job="microservicios-http-probes"} >= 500
        for: 15s
        labels:
          severity: critical
          service: admin-proyectos
        annotations:
          summary: "Error HTTP 5xx detectado en {{ $labels.instance }}"
          description: "El endpoint devolvió código de estado {{ $value }}."
