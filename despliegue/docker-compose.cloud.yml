# ============================================================================
# ORQUESTACIÓN GENERAL (Docker Compose)
# Incluye: Base de Datos MariaDB (dbgestor), MicroservicioBack (8081),
#          MicroservicioFront (8080) y Grafana (3000)
# ============================================================================
services:
  mariadb-dbgestor:
    image: mariadb:11.2
    container_name: mariadb-dbgestor
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-cloe_123}
      MARIADB_DATABASE: dbgestor
    ports:
      - "3307:3306"
    volumes:
      - ../dump-dbgestor-202406261453.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - circuito-net

  microservicio-back:
    build:
      context: ..
      dockerfile: despliegue/Dockerfile.backend
    container_name: microservicio-back
    restart: unless-stopped
    depends_on:
      mariadb-dbgestor:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-dbgestor:3306/dbgestor
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_ROOT_PASSWORD:-cloe_123}
    ports:
      - "8081:8081"
      - "8080:8080"
    networks:
      - circuito-net

  microservicio-front:
    build:
      context: ..
      dockerfile: despliegue/Dockerfile.frontend
    container_name: microservicio-front
    restart: unless-stopped
    depends_on:
      - microservicio-back
    environment:
      SERVER_PORT: 8080
    network_mode: "service:microservicio-back"

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana-devops
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoreo/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoreo/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - circuito-net

networks:
  circuito-net:
    driver: bridge

volumes:
  mariadb_data:
  grafana_data:
